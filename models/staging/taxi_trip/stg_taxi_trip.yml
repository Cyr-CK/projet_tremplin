version: 2

models:
  - name: stg_taxi_trip
    description: Staged taxi trip data from Kaggle NYC Taxi Trip dataset.
    columns:
      - name: PULocationID
        description: Foreign key to stg_taxi_trip__zone.LocationID.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_taxi_trip__zone')
              field: LocationID              
  - name: stg_taxi_trip__zone
    description: Staged NYC neighborhood zones.
    columns:
      - name: LocationID
        description: Primary key for NYC locations.
        data_tests:
          - unique
          - not_null
